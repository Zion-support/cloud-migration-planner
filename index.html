<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Cloud Migration Planner</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:110px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>☁️ Cloud Migration Planner</h1><p>Estimate migration effort and savings.</p><label>VMs/servers: <input id="v" type="number" value="50"></label> <label>On-prem monthly cost ($): <input id="c" type="number" value="15000"></label> <label>Legacy share (%): <input id="l" type="number" value="30"></label> <button onclick="go()">Plan</button><div id="out"></div><script>function go(){const g=id=>+document.getElementById(id).value;const v=g('v'),weeks=Math.ceil(v/8),save=Math.round(g('c')*0.28);document.getElementById('out').textContent=`Migration waves: ${Math.ceil(v/15)} (est. ${weeks} weeks)\nLegacy workloads needing refactor: ${Math.round(v*g('l')/100)}\nProjected cloud savings: ~$${save.toLocaleString()}/mo (28%)\nReadiness: ${g('l')>40?'🟡 assess legacy dependencies first':'🟢 good candidate for lift-and-shift + optimize'}\n\nFull migration assessment & execution: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/cloud-migration-planner">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-data-migration/">Data Migration</a></p></body></html>
